<!DOCTYPE html>
<html lang="de">
  <head>
		<meta charset="utf-8">  
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="water.min.css">
	<title> Eingabe mit prompt </title>
	<script>
		var laenge = parseFloat(prompt("Bitte geben Sie die Länge in cm ein: "));
		var breite = parseFloat(prompt("Bitte geben Sie die Breite in cm ein: "));
		var flaeche = laenge*breite;
		var umfang = 2*(laenge+breite);
		alert("Bei einer Länge von "+laenge+" cm und einer Breite von "+breite+" cm beträgt die Fläche "+flaeche+" cm^2 und der Umfang "+umfang+" cm.");
	</script>
  </head>		

  <body>
  </body>
</html>

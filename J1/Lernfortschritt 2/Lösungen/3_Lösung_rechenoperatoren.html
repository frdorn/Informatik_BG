<!DOCTYPE html>
<html lang="de">
   <head>
		<meta charset="utf-8">  
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="water.min.css">
	<title> Rechenoperatoren </title>
	<script>
		// Dekleration und Initialisierung
		var zahl1 = 13;                
		var zahl2 = 7;

		//Berechnung
		var plus = zahl1+zahl2;  
		var minus = zahl1-zahl2;  
		var mal= zahl1*zahl2;  
		var geteilt = zahl1/zahl2;  
		var hoch = zahl1**zahl2; 	

		// Ausgabe 
		document.write("<h2>"+"Rechenbeispiele:"+"</h2>")
		document.write(zahl1 +" + "+ zahl2 + " = "+plus+"<br>");   
		document.write(zahl1 +" - "+ zahl2 + " = "+minus+"<br>");
		document.write(zahl1 +" * "+ zahl2 + " = "+mal+"<br>");
		document.write(zahl1 +" / "+ zahl2 + " = "+geteilt+"<br>");
		document.write(zahl1 +" ^ "+ zahl2 + " = "+hoch+"<br>");

	</script>
   </head>		

   <body>
   </body>
</html>

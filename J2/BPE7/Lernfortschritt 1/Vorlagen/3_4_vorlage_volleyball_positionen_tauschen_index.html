<!DOCTYPE html>
<html lang="de">

    <title>

      function zeigeAufstellung() {
          window.alert("Diese Spieler sind in der Startaufstellung : " + "\n" + "\n" + spieler);
      }

      function mannschaftUmstellenPos() {
          var pos1 = parseInt(document.getElementById("pos1").value);
          var pos2 = parseInt(document.getElementById("pos2").value);




      }
    </script>
  </head>
  <body>
    <header class="verein">
      <h1>
        Mühlberger Sport Club
      </h1>
      <img alt="Vereinslogo" class="logo" src="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/Vorlagen/bilder/logo.jpg" title="Unser neues Vereinslogo">

        <tr>
          <td>

          </td>
        </tr>
      </table>
    </main>
  </body>
</html>

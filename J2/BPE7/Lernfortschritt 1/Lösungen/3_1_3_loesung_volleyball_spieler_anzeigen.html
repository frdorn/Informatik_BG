<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/format.css" rel="stylesheet">
    <title>
      Spieler der Volleyballmannschaft
    </title>
    <script>
      var spieler = ["Armin", "Batu", "Kai", "Sven", "Paul", "Milan"];
      var ersatz =  ["Chris", "Dennis", "Emin", "Goran", "Luca", "Nico"];

      function zeigeStartaufstellung() {
          var laenge = spieler.length;
          var anzeige = "";
          for (var i = 0; i < laenge; i++) {
              anzeige = anzeige + "\n" + "Position " + (i+1) + ": " + spieler[i];    
          }    
          window.alert("Startaufstellung: " + "\n" + anzeige);
      }

      function zeigeErsatzspieler() {        
          window.alert("Diese Spieler sind Ersatzspieler: " + "\n" + "\n" + ersatz);
      }

      function zeigeKader() {
          var kader = [];
          kader = spieler + ersatz;
          window.alert("Diese Spieler sind im Mannschaftskader: " + "\n" + "\n" + kader);
      }  
    </script>
  </head>
  <body>
    <header class="verein">
      <h1>
        Mühlberger Sport Club
      </h1>
      <img alt="Vereinslogo" class="logo" src="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/bilder/logo.jpg" title="Unser neues Vereinslogo">
    </header>
    <section class="thema">
      <h2>
        Abteilung Volleyball
      </h2>
      <img alt="Volleyball" src="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/bilder/volleyball.jpg" title="Volleyball">
    </section>
    <main>
      <table class="eingaben">
        <tr>
          <td>
            Startaufstellung
          </td>
          <td>
            <button onclick="zeigeStartaufstellung()">
              anzeigen
            </button>
          </td>
        </tr>
        <tr>
          <td>
            Ersatzspieler
          </td>
          <td>
            <button onclick="zeigeErsatzspieler()">
              anzeigen
            </button>
          </td>
        </tr>
        <tr>
          <td>
            Mannschaftskader
          </td>
          <td>
            <button onclick="zeigeKader()">
              anzeigen
            </button>
          </td>
        </tr>
      </table>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/format.css" rel="stylesheet">
    <title>
      Gewinnziehung
    </title>
    <script>
      var gLosNr = []; 

      function starteCode() {

          var i = gLosNr.length;

          gLosNr[i] = document.getElementById("gLnr").value;

          document.getElementById("gLnr").value = ""; //Textfeld wird leer

          document.getElementById("gewinne").innerHTML += gLosNr[i] + "<br>";       

      }
    </script>
  </head>
  <body>
    <header class="verein">
      <h1>
        Mühlberger Sport Club
      </h1>
      <img alt="Vereinslogo" class="logo" src="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/bilder/logo.jpg" title="Unser neues Vereinslogo">
    </header>
    <section class="thema">
      <h2>
        Ziehung der Gewinnlose
      </h2>
      <img alt="Dartpfeile" src="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/bilder/lose.jpg" title="Dartpfeile">
    </section>
    <main>
      <p>
        Gezogene Losnummer:
        <input id="gLnr" maxlength="50" size="20" type="text">
        <button onclick="starteCode()">
          hinzufügen
        </button>
      </p>
      <div class="ausgabe" id="gewinne">
        Gewinnlose:
      </div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/format.css" rel="stylesheet">
    <title>
      Vereinsmeisterschaften
    </title>
    <script>
      var platzierung19 = ["Matthias Schmitt", "Felix Holzmann", "Sabrina Eggers", "Sebastian Wolf", "Niklas Eisenbaum", "Florian Kuster", "Jan Ackerman", "Erika Ebersbacher"];
      var platzierung18 = ["Felix Holzmann", "Erika Ebersbacher", "Matthias Schmitt", "Sebastian Wolf", "Sabrina Eggers", "Florian Kuster"];
      var platzierung17 = ["Felix Holzmann", "Sebastian Wolf", "Sabrina Eggers"];

      // top2017(), top2018() und top2019() werden aufgerufen, wenn auf die entsprechenden Buttons geklickt wird
      function top2017() {
          zeigeTop3(platzierung17);
      }

      function top2018() {
          zeigeTop3(platzierung18);
      }

      function top2019() {
          zeigeTop3(platzierung19);
      }

      function zeigeTop3(pPlatzierung) {
          alert( "Unsere Sieger:" + "\n" + "\n" +
                          "Gold: " + pPlatzierung[0] + "\n" +
                          "Silber: " + pPlatzierung[1] + "\n" +
                          "Bronze: " + pPlatzierung[2] + "\n" +
                          "Teilnehmerzahl: " + pPlatzierung.length);    
      }        
    </script>
  </head>
  <body>
    <header class="verein">
      <h1>
        Mühlberger Sport Club
      </h1>
      <img alt="Vereinslogo" class="logo" src="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/bilder/logo.jpg" title="Unser neues Vereinslogo">
    </header>
    <section class="thema">
      <h2>
        Vereinsmeisterschaften Abteilung Dart
      </h2>
      <img alt="Dartpfeile" src="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/bilder/dart.jpg" title="Dartpfeile">
    </section>
    <main>
      <button onclick="top2019()">
        Zeige TOP 3 von 2019
      </button>
      <button onclick="top2018()">
        Zeige TOP 3 von 2018
      </button>
      <button onclick="top2017()">
        Zeige TOP 3 von 2017
      </button>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/format.css" rel="stylesheet">
    <title>
      Trainingsanalyse
    </title>
    <script>
      function starteCode() {
              var wuerfe = [];
          //Einlesen
          wuerfe[0] = parseInt(document.getElementById("w1").value);
          wuerfe[1] = parseInt(document.getElementById("w2").value);
          wuerfe[2] = parseInt(document.getElementById("w3").value);
          wuerfe[3] = parseInt(document.getElementById("w4").value);
          wuerfe[4] = parseInt(document.getElementById("w5").value);
          wuerfe[5] = parseInt(document.getElementById("w6").value);
          var maxP = wuerfe[0];
          var minP = wuerfe[0];
          var summeP = wuerfe[0];
          //Auswertung bester, schlechtester und durchschnittlicher Wurf

          for(var i = 1; i < wuerfe.length; i++) {
          if(wuerfe[i] > maxP) {
          maxP = wuerfe[i];
         }
          if(wuerfe[i] < minP) {
          minP = wuerfe[i];
          }
          summeP = summeP + wuerfe[i];        
      }
      mittelP = summeP / wuerfe.length;

          //Ausgabe
          window.alert("Bester Wurf: " + maxP + "\n" +
                       "Schlechtester Wurf: " + minP + "\n" +
                       "Durchschnittliche Punktzahl: " + mittelP);
      }
    </script>
  </head>
  <body>
    <header class="verein">
      <h1>
        Mühlberger Sport Club
      </h1>
      <img alt="Vereinslogo" class="logo" src="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/bilder/logo.jpg" title="Unser neues Vereinslogo">
    </header>
    <section class="thema">
      <h2>
        Abteilung Dart - Trainingsanalyse
      </h2>
      <img alt="Pfeile" src="https://frdorn.github.io/Informatik_BG/J2/BPE7/Lernfortschritt%201/L%C3%B6sungen/bilder/dart.jpg" title="Dartpfeile">
    </section>
    <main>
      <table class="daten">
        <tr>
          <th>
            1. Wurf
          </th>
          <th>
            2. Wurf
          </th>
          <th>
            3. Wurf
          </th>
          <th>
            4. Wurf
          </th>
          <th>
            5. Wurf
          </th>
          <th>
            6. Wurf
          </th>
        </tr>
        <tr>
          <td>
            <input id="w1" maxlength="3" size="3" type="text">
          </td>
          <td>
            <input id="w2" maxlength="3" size="3" type="text">
          </td>
          <td>
            <input id="w3" maxlength="3" size="3" type="text">
          </td>
          <td>
            <input id="w4" maxlength="3" size="3" type="text">
          </td>
          <td>
            <input id="w5" maxlength="3" size="3" type="text">
          </td>
          <td>
            <input id="w6" maxlength="3" size="3" type="text">
          </td>
        </tr>
      </table>
      <button onclick="starteCode()">
        auswerten
      </button>
    </main>
  </body>
</html>
